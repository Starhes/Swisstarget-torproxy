services:
  tor:
    image: dperson/torproxy:latest
    container_name: tor-proxy
    restart: unless-stopped
    environment:
      - PASSWORD=torpassword123
      - TOR_MaxCircuitDirtiness=60
    ports:
      - "9050:9050" # SOCKS5 proxy
      - "9051:9051" # Control port
    networks:
      - tor-network

  proxy:
    image: ghcr.io/starhes/swisstarget-torproxy:latest
    # Uncomment below and comment image above to build locally
    # build: .
    container_name: swistarget-proxy
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - TOR_SOCKS_HOST=tor
      - TOR_SOCKS_PORT=9050
      - TOR_CONTROL_HOST=tor
      - TOR_CONTROL_PORT=9051
      - TOR_CONTROL_PASSWORD=torpassword123
      - PROXY_HOST=0.0.0.0
      - PROXY_PORT=5000
      - AUTH_ENABLED=true
      - AUTH_API_KEY=your_secret_key_here # Change this!
    depends_on:
      - tor
    networks:
      - tor-network

networks:
  tor-network:
    driver: bridge
